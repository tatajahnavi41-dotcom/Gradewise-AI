services:
  # Backend Web Service (Render)
  - type: web
    name: gradewise-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8

  # Frontend Web Service (Render Static Site)
  - type: web
    name: gradewise-ai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_API_BASE
        value: https://gradewise-ai-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

